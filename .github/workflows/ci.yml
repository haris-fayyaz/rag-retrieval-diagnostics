name: CI

on:
  push:
    branches: [main, develop, '**']
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest

      - name: Test evaluation script
        run: |
          python -m scripts.evaluate_retrieval --mode tfidf --min-score 0.10 --top-k 3
          python -m scripts.evaluate_retrieval --mode semantic --min-score 0.15 --top-k 3
          python -m scripts.evaluate_retrieval --mode hybrid --min-score 0.15 --top-k 3